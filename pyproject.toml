[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quinepack"
dynamic = ["version"]
description = "Build self-containing (quine) archives from local files and directories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
quinepack = "quinepack.cli:main"

[tool.setuptools]
packages = ["quinepack", "quinepack.formats"]

[tool.setuptools.dynamic]
version = { attr = "quinepack.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]